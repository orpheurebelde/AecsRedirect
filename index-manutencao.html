<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Site em manutenção — Câmara Municipal de Vila Nova de Gaia</title>
  <style>
    :root { --background:#f3f4f6; --surface:#fff; --text:#15181d; --muted:#596072; --line:#e3e6eb; }
    @media (prefers-color-scheme: dark) { :root { --background:#0f1115; --surface:#181b21; --text:#e8ebf0; --muted:#a2a9b6; --line:#282d36; } }
    * { box-sizing:border-box; }
    html, body { min-height:100%; }
    body { display:grid; place-items:center; margin:0; padding:24px; background:var(--background); color:var(--text); font:16px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
    main { width:min(640px,100%); padding:40px 32px; text-align:center; background:var(--surface); border:1px solid var(--line); border-radius:14px; }
    h1 { margin:0 0 16px; font-size:1.5rem; line-height:1.3; }
    p { margin:0; color:var(--muted); }
    .foot { margin-top:26px; padding-top:20px; border-top:1px solid var(--line); font-size:.875rem; }
    @media (max-width:420px) { main { padding:28px 20px; } h1 { font-size:1.3rem; } }
  </style>
</head>
<body>
  <main>
    <h1>Site em manutenção</h1>
    <p>Estamos a efetuar trabalhos de manutenção. Por favor, tente novamente mais tarde.</p>
    <p class="foot">Câmara Municipal de Vila Nova de Gaia</p>
  </main>
</body>
</html>
